<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #9b63e8; --primary-dark: #6b3fb0; --primary-light: #f3ecff;
    --pink: #ff8fab; --pink-light: #ffe5ec; --mint: #2dc6b1; --mint-light: #e0f8f5;
    --ink: #2d2640; --muted: #6f6787;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: 'Outfit', 'Nirmala UI', system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(135deg, #fdfbff 0%, #f6efff 55%, #ffeef3 100%);
    position: relative;
  }
  .hi { font-family: 'Mukta', 'Nirmala UI', sans-serif; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 420px; height: 420px; background: #e3d1ff; top: -140px; right: -90px; }
  .b2 { width: 360px; height: 360px; background: #ffd3df; bottom: -160px; left: -120px; }
  .b3 { width: 260px; height: 260px; background: #c9f3ec; bottom: -80px; right: 260px; opacity: .45; }

  .top { position: absolute; top: 28px; left: 56px; right: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--primary-dark); }
  .lotus { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--pink)); color: #fff; font-size: 18px; box-shadow: 0 6px 14px rgba(155,99,232,.35); }
  .course { font-size: 15px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.75); padding: 7px 14px; border-radius: 999px; border: 1px solid #ebe2fb; }

  .main { position: absolute; top: 96px; bottom: 70px; left: 56px; right: 56px; display: flex; gap: 40px; align-items: center; }
  .text { flex: 1.35; min-width: 0; }
  .kicker { display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); background: var(--primary-light); padding: 6px 12px; border-radius: 8px; }
  h1 { margin-top: 14px; font-size: 50px; line-height: 1.06; font-weight: 800; letter-spacing: -.01em; }
  h2 { margin-top: 6px; font-size: 32px; line-height: 1.25; font-weight: 600; color: var(--primary-dark); }
  ul { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  li { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.88); border: 1px solid #eee6fb; border-radius: 16px; padding: 12px 18px; box-shadow: 0 8px 20px -12px rgba(107,63,176,.35); }
  li.hidden { visibility: hidden; }
  li.new { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(155,99,232,.18), 0 10px 24px -12px rgba(107,63,176,.5); }
  li .ic { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 25px; background: var(--primary-light); }
  li:nth-child(3n+2) .ic { background: var(--pink-light); }
  li:nth-child(3n+3) .ic { background: var(--mint-light); }
  li .en { font-size: 21px; font-weight: 600; line-height: 1.2; }
  li .hl { font-size: 18px; color: var(--muted); line-height: 1.3; }

  .visual { flex: 1; display: grid; place-items: center; }
  .disc { width: 400px; height: 400px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f3ecff 55%, #e7d8ff 100%);
    box-shadow: 0 30px 60px -30px rgba(107,63,176,.55), inset 0 0 0 10px rgba(255,255,255,.7); }
  .disc .emoji { font-size: 170px; line-height: 1; font-family: 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  .disc .cap { position: absolute; bottom: -18px; background: #fff; border-radius: 999px; padding: 8px 20px; font-weight: 700; font-size: 18px; color: var(--primary-dark); box-shadow: 0 10px 24px -14px rgba(0,0,0,.4); white-space: nowrap; }
  .stat { text-align: center; }
  .stat .big { font-size: 128px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--primary), #e0608a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .unit { font-size: 26px; font-weight: 700; color: var(--ink); margin-top: 8px; }
  .stat .hu { font-size: 24px; color: var(--muted); }

  /* title slide */
  .title-slide .main { flex-direction: column; justify-content: center; text-align: center; gap: 18px; }
  .title-slide .disc { width: 230px; height: 230px; }
  .title-slide .disc .emoji { font-size: 110px; }
  .title-slide h1 { font-size: 66px; margin-top: 8px; }
  .title-slide h2 { font-size: 40px; }

  .foot { position: absolute; left: 56px; right: 56px; bottom: 30px; display: flex; align-items: center; gap: 14px; }
  .bar { flex: 1; height: 6px; border-radius: 6px; background: #ece4fa; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--pink)); }
  .count { font-size: 14px; font-weight: 600; color: var(--muted); }
  .ai { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .ai b { background: var(--ink); color: #fff; border-radius: 5px; padding: 2px 6px; font-size: 11px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="root"></div>
<script>
  const S = /*DATA*/null;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // the cycle ring: 28 days, the period days in pink
  const cycle = () => {
    const r = 150, c = 2 * Math.PI * r;
    return `<div class="disc" style="background:radial-gradient(circle at 35% 30%,#fff,#f6f0ff)">
      <svg width="360" height="360" viewBox="0 0 360 360" style="position:absolute">
        <circle cx="180" cy="180" r="${r}" fill="none" stroke="#e9ddff" stroke-width="26"/>
        <circle cx="180" cy="180" r="${r}" fill="none" stroke="#ff7aa0" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="${(c * 5) / 28} ${c}" transform="rotate(-90 180 180)"/>
        <circle cx="180" cy="180" r="${r}" fill="none" stroke="#9b63e8" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="${(c * 3) / 28} ${c}" transform="rotate(${-90 + (360 * 13) / 28} 180 180)"/>
      </svg>
      <div class="stat" style="position:relative"><div class="big" style="font-size:104px">28</div><div class="unit">days · दिन</div></div>
      <div class="cap"><span style="color:#ff5c8a">●</span> period &nbsp; <span style="color:#9b63e8">●</span> egg released</div>
    </div>`;
  };
  const visual = (v = {}) => {
    if (v.type === 'cycle') return cycle();
    if (v.type === 'stat')
      return `<div class="disc"><div class="stat"><div class="big">${esc(v.big)}</div><div class="unit">${esc(v.unit)}</div><div class="hu hi">${esc(v.hi_unit)}</div></div></div>`;
    return `<div class="disc"><div class="emoji">${v.emoji || '🌸'}</div>${v.caption ? `<div class="cap">${esc(v.caption)}</div>` : ''}</div>`;
  };
  const bullets = (S.bullets || [])
    .map((b, i) => `<li class="${i >= S.reveal ? 'hidden' : i === S.reveal - 1 ? 'new' : ''}"><div class="ic">${b.icon}</div><div><div class="en">${esc(b.en)}</div><div class="hl hi">${esc(b.hi)}</div></div></li>`)
    .join('');
  document.body.classList.toggle('title-slide', !!S.isTitle);
  document.getElementById('root').innerHTML = `
    <div class="top">
      <div class="brand"><div class="lotus">❀</div>NariShakti <span class="hi" style="font-weight:600;color:#9a8fb3">· नारीशक्ति</span></div>
      <div class="course">${esc(S.course)} · Lesson ${S.lessonNo}</div>
    </div>
    <div class="main">
      ${S.isTitle
        ? `${visual(S.visual)}<div><span class="kicker">${esc(S.kicker)}</span><h1>${esc(S.title)}</h1><h2 class="hi">${esc(S.hi_title)}</h2></div>`
        : `<div class="text"><span class="kicker">${esc(S.kicker)}</span><h1>${esc(S.title)}</h1><h2 class="hi">${esc(S.hi_title)}</h2><ul>${bullets}</ul></div><div class="visual">${visual(S.visual)}</div>`}
    </div>
    <div class="foot">
      <div class="count">${S.index + 1} / ${S.total}</div>
      <div class="bar"><span style="width:${((S.index + 1) / S.total) * 100}%"></span></div>
      <div class="ai"><b>AI</b> narrated lesson</div>
    </div>`;
</script>
</body>
</html>
